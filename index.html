<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ある人生">
  <title>ある人生 - Life Simulator</title>
  <link rel="stylesheet" href="style.css?v=20261026-4">
</head>

<body>
  <main>
    <div class="workspace">
      <!-- 左カラム（デスクトップ）/ 下部詳細（スマホ）：プロフィール・ステータス・経験等 -->
      <section class="panel profile-panel">
        <div class="profile-summary">
          <div id="identity"></div>
          <div id="personalityInterest"></div>
          <div id="partnerStatus"></div>
          <div id="statusEmptySlot" class="status-empty-slot"></div>
          <div id="location" style="display:none;"></div>
        </div>
        <div class="stats" id="stats"></div>
        <!-- 人間関係パネル（デスクトップ時：パラメータの下、スマホ時：操作パネルの上へ動的配置） -->
        <section class="panel bonds-panel">
          <div id="bonds"></div>
        </section>
        <div id="experiencePanel"></div>
        <div id="internalParams"></div>
      </section>

      <!-- スリム操作パネル（時間の経過：円形プログレスリング） -->
      <section class="panel play-panel">
        <div class="play-controls-row">
          <button id="autoToggle" class="primary play-btn" title="進行 / 一時停止を切り替えます">
            <span id="autoToggleIcon">⏸</span> <span id="autoToggleText">一時停止</span>
          </button>

          <!-- 時間の経過インジケーター（円形リング＋年齢進行） -->
          <div id="timeProgressBox" class="time-progress-box" title="1年の経過インジケーター">
            <div class="time-ring-wrapper">
              <svg class="time-ring" width="24" height="24" viewBox="0 0 32 32">
                <circle class="time-ring-bg" cx="16" cy="16" r="13" />
                <circle id="timeProgressBar" class="time-ring-fg" cx="16" cy="16" r="13" />
              </svg>
            </div>
            <div class="time-text-group">
              <span id="timeProgressAge" class="time-age-text">0歳 → 1歳</span>
              <span id="timeProgressLabel" class="time-status-text">自動進行中</span>
            </div>
          </div>

          <div class="play-config-group">
            <select id="autoSpeedSelect" class="compact-select" title="進行速度">
              <option value="280" selected>速度:普通</option>
              <option value="120">速度:速い</option>
              <option value="550">速度:遅い</option>
            </select>
            <select id="mode" class="compact-select" title="プレイモード">
              <option value="choice">選択介入</option>
              <option value="auto">全自動</option>
              <option value="free">自由入力</option>
            </select>
          </div>
        </div>

        <div id="intervene" style="display:none;margin-top:6px;">
          <h2 style="margin:4px 0 2px;font-size:12px;">自由入力</h2><textarea id="command"
            placeholder="例：勉強する／転職したい／貯金する／女性と交際したい／秘密を打ち明ける"></textarea>
          <div class="controls"><button id="act">行動する</button><span class="muted" id="feedback"></span></div>
        </div>
      </section>

      <!-- 人生の記録パネル -->
      <section class="panel history-panel">
        <h2>人生の記録</h2>
        <div id="event"></div>
        <div id="history" class="log"></div>
      </section>
    </div>

    <!-- ページ下部：バージョン情報・新しい人生ボタン・フッター注記 -->
    <footer class="app-footer">
      <div class="footer-actions">
        <button class="secondary restart-btn" id="restart">新しい人生</button>
        <span id="buildVersion" class="build-version">v1.22.16 (b20261026-8)</span>
      </div>
      <p class="muted footer-note">完全ローカル動作。データはブラウザ内に保存されます。イベントや確率は試作用の仮定値であり、実際の日本の統計ではありません。</p>
    </footer>
  </main>
  <script>window.BUILD_CACHE_KEY = '20261026-8';</script>
  <script src="events/manifest.js?v=20261026-8"></script>
  <script src="events/loader.js?v=20261026-8"></script>
  <script src="js/app.js?v=20261026-8"></script>
</body>

</html>
