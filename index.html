<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ある人生">
  <title>ある人生 — Life Simulator</title>
  <link rel="stylesheet" href="style.css?v=20261021-1">
</head>

<body>
  <main>
    <header>
      <div class="header-title-group">
        <h1>ある人生</h1>
        <span id="buildVersion" class="build-version">v1.20.0 (b20261021-1)</span>
      </div><button class="secondary" id="restart">新しい人生</button>
    </header>
    <div class="workspace">
      <section class="panel profile-panel">
        <div class="profile-summary">
          <div id="identity"></div>
          <div id="partnerStatus"></div>
          <div id="location"></div>
        </div>
        <div class="stats" id="stats"></div>
        <div id="bonds"></div>
        <div id="experiencePanel"></div>
        <div id="internalParams"></div>
      </section>
      <section class="panel play-panel">
        <div class="controls" style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;">
          <button id="autoToggle" class="primary"
            style="font-weight:700;min-width:105px;display:inline-flex;align-items:center;justify-content:center;gap:4px;">
            <span id="autoToggleIcon">⏸</span> <span id="autoToggleText">一時停止</span>
          </button>
          <select id="autoSpeedSelect"
            style="padding:5px 8px;font-size:12px;border-radius:4px;border:1px solid #cbd5e1;background:#fff;color:#23333b;cursor:pointer;">
            <option value="1200" selected>速度：普通 (1.2秒)</option>
            <option value="600">速度：速い (0.6秒)</option>
            <option value="2000">速度：ゆっくり (2.0秒)</option>
          </select>
          <select id="mode" style="margin-left:auto;font-size:11.5px;padding:3px 6px;background:#fff;color:#23333b;">
            <option value="choice">選択介入</option>
            <option value="auto">全自動</option>
            <option value="free">自由入力</option>
          </select>
        </div>
        <!-- 時間の経過を示すバー -->
        <div id="timeProgressBarWrapper"
          style="margin:8px 0 5px;padding:6px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;">
          <div
            style="display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:4px;font-weight:600;">
            <span id="timeProgressLabel" style="color:#4338ca;display:inline-flex;align-items:center;gap:4px;">⏳
              時間の経過（自動進行中）</span>
            <span id="timeProgressAge" style="color:#64748b;font-size:11px;">0歳 → 1歳</span>
          </div>
          <div style="width:100%;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;position:relative;">
            <div id="timeProgressBar"
              style="width:0%;height:100%;background:linear-gradient(90deg, #6366f1, #a855f7);border-radius:3px;"></div>
          </div>
        </div>
        <div id="playNotice" class="muted" style="margin-top:4px;font-size:11px;">
          重要なイベントでは進行が停止します。選択・結果は「人生の記録」に表示されます。</div>
        <div id="intervene" style="display:none;">
          <h2 style="margin:4px 0 2px;font-size:12px;">自由入力</h2><textarea id="command"
            placeholder="例：勉強する／転職したい／貯金する／女性と交際したい／秘密を打ち明ける"></textarea>
          <div class="controls"><button id="act">行動する</button><span class="muted" id="feedback"></span></div>
        </div>
      </section>
      <section class="panel history-panel">
        <h2>人生の記録</h2>
        <div id="event"></div>
        <div id="history" class="log"></div>
      </section>
    </div>
    <p class="muted footer-note">完全ローカル動作。データはブラウザ内に保存されます。イベントや確率は試作用の仮定値であり、実際の日本の統計ではありません。</p>
  </main>
  <script>window.BUILD_CACHE_KEY = '20261021-1';</script>
  <script src="events/manifest.js?v=20261021-1"></script>
  <script src="events/loader.js?v=20261021-1"></script>
  <script src="js/app.js?v=20261021-1"></script>
</body>

</html>
