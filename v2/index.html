<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生シミュレータ｜20〜30歳</title><style>
:root{font-family:system-ui,-apple-system,'Yu Gothic',Meiryo,sans-serif;color:#263342;background:#f5f5f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1130px;margin:auto;padding:22px 18px 70px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}.sub,.muted{color:#697786;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:16px}.panel{background:#fff;border:1px solid #e3e5e4;border-radius:14px;padding:19px;margin-bottom:16px;box-shadow:0 2px 12px #14253606}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f6f8f8;border-radius:9px;padding:9px}.stat small{display:block;color:#73808b;font-size:11px}.stat strong{font-size:14px}.params{display:grid;grid-template-columns:1fr 1fr;gap:10px}.param{font-size:12px}.bar{height:6px;background:#e6e9ec;border-radius:4px;margin-top:5px;overflow:hidden}.fill{height:100%;background:#587d9c}.tag{display:inline-block;border:1px solid #d7e0e5;background:#f2f7f9;border-radius:20px;padding:5px 9px;margin:3px;font-size:12px}.event{border-left:4px solid #4e7898;padding-left:15px}.event h2{font-size:22px;margin:8px 0}.event p{line-height:1.85;white-space:pre-wrap}.choice{display:block;width:100%;border:1px solid #dce2e6;border-radius:10px;padding:12px;text-align:left;background:white;cursor:pointer;margin:9px 0;color:inherit}.choice:hover{border-color:#678ea8;background:#f5f9fc}.choice.selected{border-color:#377ba5;background:#edf6fc}.choice b{display:block}.choice small{display:block;margin-top:4px;color:#6b7884}.btn{border:0;border-radius:9px;padding:11px 16px;background:#355f7f;color:white;cursor:pointer;font-size:14px}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#edf1f4;color:#2d536d}.btn:disabled{opacity:.45;cursor:default}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.changes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.change{background:#f2f6f8;padding:10px;border-radius:9px;font-size:12px}.change strong{display:block;margin-top:3px;font-size:14px}.timeline{max-height:440px;overflow:auto}.entry{padding:10px 0;border-bottom:1px solid #edf0f0;font-size:13px}.entry .date{color:#79848e;font-size:11px}.entry .cause{color:#507d9a;font-size:11px;margin-top:5px}.entry p{margin:5px 0;line-height:1.6}.entry button{background:none;border:none;color:#477ba2;padding:0;cursor:pointer;text-align:left}.meter{height:7px;background:#e6ebee;border-radius:6px;overflow:hidden}.meter span{display:block;height:100%;background:#6287a5}.notice{padding:10px 12px;border-radius:9px;background:#f0f5f9;font-size:12px;line-height:1.6}.footer{font-size:12px;color:#77838b;margin-top:14px}input[type=text],input[type=number],select{padding:9px;border:1px solid #cbd4dc;border-radius:8px;font:inherit;max-width:100%}details{margin:8px 0}summary{cursor:pointer;font-weight:600;font-size:13px}textarea{width:100%;min-height:75px;border:1px solid #d1d9df;border-radius:8px;padding:10px}#error{color:#a33;font-size:12px}.switch{display:flex;align-items:center;gap:6px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}header{display:block}.params{grid-template-columns:1fr 1fr}} </style></head><body><div class="wrap"><header><div><h1>人生シミュレータ <span class="muted">20歳 → 30歳</span></h1><div class="sub">選択が人生を変える、オフライン・プロトタイプ</div></div><div class="buttons"><button class="btn secondary" id="newBtn">新しい人生</button><button class="btn secondary" id="exportBtn">セーブ書出し</button><label class="btn secondary" style="cursor:pointer">読込み<input id="importFile" type="file" accept="application/json" hidden></label></div></header><div id="error"></div><div class="grid"><main><section class="panel" id="profile"></section><section class="panel" id="event"></section><section class="panel" id="history"></section></main><aside><section class="panel" id="parameters"></section><section class="panel" id="scenarios"></section><section class="panel" id="turning"></section><section class="panel" id="details"></section></aside></div><div class="footer">すべての処理はこの端末内で実行されます。進行状況はブラウザのlocalStorageに自動保存されます。</div></div><script src="sim.js"></script></body></html>
